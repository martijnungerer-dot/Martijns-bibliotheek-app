<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>MeerLezen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: telefoon-eerst prentenboek-app in staande stand; grote tikvlakken, de kaften dragen de kleur, planken van hout. Breder scherm = meer kolommen */
:root{
  --paper:#EAF0F5;
  --card:#FFFFFF;
  --ink:#1F2440;
  --muted:#59607D;
  --line:#D3DCE6;
  --sun:#F5B700;
  --sea:#1F8A93;
  --rose:#E8607A;
  --indigo:#3D4BA8;
  --night:#1F2440;
  --wood:#D8C3A0;
  --wood-dark:#B89B70;
  --help:#FFF4D6;
  --help-line:#F2C94C;
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sea);outline-offset:3px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-weight:800;font-size:clamp(1.85rem,7.5vw,2.9rem)}
h2{font-weight:800;font-size:1.3rem}
p{margin:0}
.wrap{max-width:1100px;margin:0 auto}

/* Kopbalk */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:2px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:4px 0;font-family:var(--f-display);font-weight:800;font-size:1.45rem;color:var(--ink)}
.logo svg{width:28px;height:28px;color:var(--sea)}
.proto{margin-left:auto;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted);border:1.5px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--card)}
main{padding-block:22px 8px;display:flex;flex-direction:column;gap:34px}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted);margin-bottom:6px}

/* Keuzes */
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
.choice{min-height:108px;border:0;border-radius:22px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;
  font-family:var(--f-display);font-weight:800;font-size:1.2rem;line-height:1.1;cursor:pointer;color:#fff;box-shadow:0 5px 0 rgba(31,36,64,.22);transition:transform .1s,box-shadow .1s}
.choice:active,.scanbtn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(31,36,64,.22)}
.choice svg{width:36px;height:36px}
.c-span{background:var(--indigo)}.c-grap{background:var(--sun);color:var(--ink)}.c-verr{background:var(--rose)}.c-zoek{background:#7B4FB5}
.scanbtn{grid-column:1/-1;display:flex;align-items:center;gap:14px;border:0;border-radius:22px;padding:16px 18px;background:var(--night);color:#fff;cursor:pointer;text-align:left;
  font-family:var(--f-display);font-weight:800;font-size:1.2rem;line-height:1.1;box-shadow:0 5px 0 rgba(31,36,64,.3);transition:transform .1s,box-shadow .1s}
.scanbtn svg{width:34px;height:34px;flex:none;color:var(--sun)}
.scanbtn small{display:block;font-family:var(--f-body);font-weight:400;font-size:.8rem;opacity:.75;margin-top:2px}

/* Kaften */
.cover{position:relative;flex:none;width:var(--w,112px);aspect-ratio:2/3;max-width:100%;border:0;border-radius:4px 10px 10px 4px;background:var(--c);color:var(--ci,#fff);
  padding:12px 10px 10px 16px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;overflow:hidden;
  box-shadow:0 10px 14px -8px rgba(31,36,64,.55),inset 7px 0 0 rgba(0,0,0,.14);transition:transform .15s}
.cover:hover{transform:translateY(-5px) rotate(-1.2deg)}
.cover .pat{position:absolute;inset:0;pointer-events:none}
.p0{background:radial-gradient(circle at 18% 82%,rgba(255,255,255,.2) 0 18%,transparent 19%),radial-gradient(circle at 86% 28%,rgba(255,255,255,.14) 0 12%,transparent 13%)}
.p1{background:repeating-linear-gradient(135deg,rgba(255,255,255,.11) 0 8px,transparent 8px 20px)}
.p2{background:radial-gradient(circle at 72% 74%,rgba(255,255,255,.24) 0 34%,transparent 35%)}
.p3{background:linear-gradient(transparent 60%,rgba(0,0,0,.15) 60% 68%,transparent 68%)}
.ct{position:relative;font-family:var(--f-display);font-weight:800;font-size:calc(var(--w,112px) * .13);line-height:1.04;overflow-wrap:break-word;hyphens:auto}
.cover.long .ct{font-size:calc(var(--w,112px) * .108)}
.ca{position:relative;font-size:calc(var(--w,112px) * .072);opacity:.88;padding-left:24px;line-height:1.2}
.stk{position:absolute;left:10px;bottom:10px;width:16px;height:16px;border-radius:50%;background:var(--g);box-shadow:0 0 0 3px #fff}
.big{--w:170px}

/* Planken */
.shelf-head{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin-bottom:10px}
.shelf-head p{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:14px;overflow-x:auto;padding:8px 6px 0;margin:0 -6px;scroll-snap-type:x proximity;align-items:flex-end;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row .cover{scroll-snap-align:start}
.plank{height:14px;border-radius:3px;background:linear-gradient(var(--wood) 0 9px,var(--wood-dark) 9px);box-shadow:0 6px 10px -6px rgba(31,36,64,.4)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:22px 14px}
.grid .cover{--w:100%}
.grid .ct{font-size:.95rem}.grid .ca{font-size:.66rem}

/* Groepsdoel */
.goal{background:var(--card);border-radius:22px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.goal .num{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1;color:var(--sea);font-variant-numeric:tabular-nums}
.meter{height:18px;border-radius:99px;background:var(--paper);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;width:0;border-radius:99px;background:repeating-linear-gradient(-45deg,var(--sun) 0 12px,#F7C933 12px 24px);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.goal small{color:var(--muted);display:block;margin-top:4px}
.ex{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1.5px dashed var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;white-space:nowrap}

/* Genres */
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:.92rem}
.pill i{width:14px;height:14px;border-radius:50%;background:var(--c)}

/* Algemeen */
.back{background:none;border:0;cursor:pointer;color:var(--sea);font-weight:600;padding:8px 0;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 20px;font-weight:600;cursor:pointer;text-align:center}
.btn.primary{background:var(--sea);border-color:var(--sea);color:#fff}
.btn.dark{background:var(--night);border-color:var(--night);color:#fff}
.btn svg{width:22px;height:22px}
.lead{color:var(--muted);margin-top:8px;max-width:60ch}

/* Zoeken */
.sform{display:flex;gap:8px;margin-top:16px}
.sform input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:14px 16px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink)}
.sform input:focus{outline:none;border-color:var(--sea)}
.sform button{border:0;border-radius:16px;padding:0 18px;background:var(--sea);color:#fff;font-weight:600;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.92rem}
.privacy{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.82rem;margin-top:12px}
.privacy svg{width:16px;height:16px;flex:none}
#results{display:flex;flex-direction:column;gap:18px;margin-top:22px}
.help{background:var(--help);border:2px solid var(--help-line);border-radius:18px;padding:14px 16px;max-width:65ch}
.help .num-inline{font-weight:600;white-space:nowrap;user-select:all}
.help.strong{background:var(--card);border-color:var(--sea);padding:20px;display:flex;flex-direction:column;gap:10px}
.phone{font-family:var(--f-display);font-weight:800;font-size:2.3rem;line-height:1;color:var(--sea);user-select:all;font-variant-numeric:tabular-nums}
.help small{color:var(--muted)}
.empty{color:var(--muted)}

/* Boek */
.detail{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start}
.detail .dcover{justify-self:center}
.dinfo{display:flex;flex-direction:column;gap:12px;max-width:62ch;min-width:0}
.by{color:var(--muted);font-size:1.02rem}
.kw{display:flex;flex-wrap:wrap;gap:8px}
.kw span{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:4px 12px;font-size:.88rem}
.where{display:flex;align-items:flex-start;gap:8px;color:var(--muted);font-size:.92rem}
.where svg{width:18px;height:18px;flex:none;margin-top:2px}
.status{display:inline-block;font-size:.78rem;font-weight:600;border-radius:99px;padding:1px 10px;background:#DDF3E6;color:#1C6B43}
.status.out{background:#FCE3E3;color:#9B2C2C}
.rating{background:var(--card);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:14px;margin-top:4px}
.rq p{font-weight:600;margin-bottom:8px}
.faces{display:flex;gap:14px}
.face{width:60px;height:60px;border-radius:50%;border:3px solid transparent;background:none;padding:0;cursor:pointer;transition:transform .15s}
.face svg{width:100%;height:100%}
.face[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.1)}
.rsum{color:var(--muted);font-size:.88rem}

/* Scannen */
.scanbox{margin-top:18px;background:var(--card);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.viewfinder{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:18px;background:var(--night);overflow:hidden;display:grid;place-items:center}
.viewfinder img{width:100%;height:100%;object-fit:cover}
.viewfinder .frame{position:absolute;inset:18% 12%;border:3px dashed rgba(255,255,255,.6);border-radius:12px}
.viewfinder .beam{position:absolute;left:12%;right:12%;top:50%;height:3px;background:var(--sun);box-shadow:0 0 12px var(--sun);animation:beam 1.6s ease-in-out infinite alternate}
.viewfinder p{position:relative;color:#fff;opacity:.85;font-size:.9rem;text-align:center;padding:0 24px}
@keyframes beam{from{transform:translateY(-60px)}to{transform:translateY(60px)}}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.scanmsg{display:flex;flex-direction:column;gap:12px}
.scanmsg .found{display:flex;gap:16px;align-items:flex-start}
.scanmsg .found .cover{--w:96px}
.claude-card{border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.claude-card .tag{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--sea)}
.claude-card h3{font-family:var(--f-display);font-weight:800;font-size:1.35rem;line-height:1.1;margin:0}
.muted{color:var(--muted);font-size:.88rem}
.demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Verras me */
.stage{position:relative;display:grid;place-items:center;min-height:300px}
.gift{position:relative;width:200px;height:175px;animation:wiggle 2.6s ease-in-out infinite;transition:transform .5s .15s,opacity .5s .15s}
.gift .box{position:absolute;bottom:0;left:10px;right:10px;height:128px;border-radius:12px;background:radial-gradient(circle,rgba(255,255,255,.35) 0 3px,transparent 4px) 0 0/22px 22px,var(--rose)}
.gift .lid{position:absolute;top:20px;left:0;right:0;height:42px;border-radius:12px;background:#D64C68;transition:transform .6s cubic-bezier(.3,1.4,.5,1),opacity .6s;z-index:2}
.gift .rib{position:absolute;left:50%;width:26px;margin-left:-13px;top:20px;bottom:0;background:var(--sun);z-index:3}
.gift .bow{position:absolute;left:50%;top:-6px;width:0;z-index:4}
.gift .bow::before,.gift .bow::after{content:"";position:absolute;top:0;width:42px;height:28px;border:8px solid var(--sun);border-radius:50%}
.gift .bow::before{right:2px;transform:rotate(-18deg)}.gift .bow::after{left:2px;transform:rotate(18deg)}
.reveal{position:absolute;left:50%;top:50%;transform:translate(-50%,-40%) scale(.3);opacity:0;transition:transform .6s .3s cubic-bezier(.3,1.4,.5,1),opacity .4s .3s;pointer-events:none}
.reveal .cover{--w:160px}
.stage.open .gift{animation:none;transform:translateY(60px) scale(.8);opacity:0}
.stage.open .lid{transform:translateY(-150px) rotate(-28deg);opacity:0}
.stage.open .reveal{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.clues{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.clues span{font-family:var(--f-display);font-weight:800;font-size:1.15rem;background:var(--card);border-radius:14px;padding:6px 14px;box-shadow:0 3px 0 var(--line)}
.gactions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:20px}
@keyframes wiggle{0%,78%,100%{transform:rotate(0)}83%{transform:rotate(-5deg)}88%{transform:rotate(5deg)}93%{transform:rotate(-3deg)}}

/* Leesmaatjes Toet & Bas */
.ava{width:56px;height:56px;flex:none;display:block}
.ava svg{width:100%;height:100%;overflow:visible;display:block}
.ava.sm{width:34px;height:34px}
.ava .bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}
.owl .lids{transform-box:fill-box;transform-origin:center top;transform:scaleY(0);animation:blink 4.5s infinite}
.worm .body{animation:wig 1.9s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
@keyframes wig{0%,100%{transform:skewX(0)}50%{transform:skewX(-7deg)}}
.duo{grid-column:1/-1;display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:10px 16px;cursor:pointer;text-align:left}
.duo .avas{display:flex;flex:none}.duo .ava{width:50px;height:50px}.duo .ava+.ava{margin-left:-4px}
.duo-t{display:flex;flex-direction:column;line-height:1.25;min-width:0}.duo-t strong{font-family:var(--f-display);font-weight:800;font-size:1.15rem}.duo-t span{color:var(--muted);font-size:.9rem}
.chat{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.line{display:flex;gap:10px;align-items:flex-end;animation:rise .3s ease-out both}
.line .bubble{background:var(--card);border-radius:18px 18px 18px 4px;padding:10px 14px;max-width:min(82%,520px);box-shadow:0 2px 0 var(--line);min-width:0}
.line .bubble b{display:block;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--pc,var(--muted));margin-bottom:2px}
.line.kid{justify-content:flex-end}
.line.kid .bubble{background:var(--sea);color:#fff;border-radius:18px 18px 4px 18px;box-shadow:none}
.dots{display:inline-flex;gap:4px;padding:6px 2px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.5;animation:dot 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-3px);opacity:.9}}
.say{border:0;background:none;padding:2px;margin-left:2px;cursor:pointer;color:var(--muted);vertical-align:-4px}
.say svg{width:18px;height:18px}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
.opt{border:2px solid var(--sea);background:var(--card);color:var(--sea);border-radius:99px;padding:10px 16px;font-weight:600;cursor:pointer;animation:rise .3s ease-out both}
.picks{flex-basis:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.picks.one{grid-template-columns:minmax(0,1fr);max-width:260px;margin:0 auto}
.pick{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:rise .35s ease-out both}
.pick-h{display:flex;align-items:center;gap:6px;font-weight:600;font-size:.88rem;color:var(--pc)}
.pick .cover{--w:100px}
.pick .why{font-size:.85rem;color:var(--muted)}
.again{flex-basis:100%;display:flex;justify-content:center;margin-top:6px}
.bookpal .line .bubble{max-width:100%}
.help.pal{display:flex;gap:12px;align-items:flex-start}

/* Binnenkomen */
.enter .cover{animation:pop .55s calc(var(--i,0) * 45ms) cubic-bezier(.3,1.4,.5,1) both}
.enter .choice,.enter .scanbtn,.enter .duo{animation:rise .45s calc(var(--i,0) * 70ms) ease-out both}
@keyframes pop{from{transform:translateY(-60px) scale(.5) rotate(-8deg);opacity:0}}
@keyframes rise{from{transform:translateY(16px);opacity:0}}

.intro{position:fixed;inset:0;z-index:50;background:var(--night);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;perspective:1200px;transition:opacity .4s;cursor:pointer;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.intro.out{opacity:0}
.book3d{position:relative;width:150px;height:205px;transform-style:preserve-3d;opacity:0}
.pages{position:absolute;inset:0;border-radius:4px 12px 12px 4px;background:repeating-linear-gradient(#fff 0 22px,#EEF1F5 22px 23px);display:grid;place-items:center;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.pages span{font-family:var(--f-display);font-weight:800;font-size:1.2rem;color:var(--ink);opacity:0;text-align:center;line-height:1.1}
.front{position:absolute;inset:0;border-radius:4px 12px 12px 4px;background:var(--sun);color:var(--ink);transform-origin:left center;backface-visibility:hidden;display:grid;place-items:center;
  font-family:var(--f-display);font-weight:800;font-size:1.7rem;box-shadow:inset 9px 0 0 rgba(0,0,0,.12)}
.intro-greet{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,6vw,2.3rem);opacity:0;text-align:center}
.skip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:.85rem;opacity:.55}
.play .book3d{animation:bookIn .5s ease-out forwards}
.play .front{animation:openCover .9s .45s cubic-bezier(.6,.05,.3,1) forwards}
.play .pages span{animation:fadeIn .4s 1.05s forwards}
.play .intro-greet{animation:fadeUp .5s 1.15s forwards}
@keyframes bookIn{from{transform:scale(.6) translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes openCover{to{transform:rotateY(-165deg)}}
@keyframes fadeIn{to{opacity:1}}
@keyframes fadeUp{from{transform:translateY(10px)}to{transform:none;opacity:1}}
.fx{position:absolute;inset:0;pointer-events:none}
.leaf{position:absolute;top:-30px;width:18px;height:18px;border-radius:0 80% 0 80%;background:var(--lc);animation:fall var(--d) linear var(--dl) forwards}
.flake{position:absolute;top:-20px;width:8px;height:8px;border-radius:50%;background:#fff;opacity:.85;animation:fall var(--d) linear var(--dl) forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(540deg)}}

/* Voettekst + melding */
footer{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:.78rem;padding-block:28px calc(28px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);margin-top:36px}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--sea);font-weight:600;cursor:pointer;text-decoration:underline;align-self:flex-start}

function doSearch(q){
  state.q=q;const r=$('#results');if(!r)return;
  const n=norm(q);
  if(!n){r.innerHTML='';return;}
  if(SIGNAL.some(s=>n.includes(norm(s)))){r.innerHTML=helpCard(true);return;}
  const matched=Object.keys(CONCEPTS).filter(k=>CONCEPTS[k].w.some(w=>n.includes(norm(w))));
  const heavy=matched.some(k=>CONCEPTS[k].heavy);
  const scored=BOOKS.map(b=>{
    let s=b.cs.filter(c=>matched.includes(c)).length*2;
    if(n.length>=3&&(norm(b.t).includes(n)||norm(b.a).includes(n)||b.kw.some(k=>norm(k).includes(n))))s+=3;
    return {b,s};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||b.b.likes-a.b.likes);
  let html=heavy?helpCard(false):'';
  html+=scored.length
    ?`<h2>${scored.length} ${scored.length===1?'boek':'boeken'} over “${esc(q)}”</h2><div class="grid">${scored.map((x,i)=>cover(x.b,i,'','search')).join('')}</div>`
    :`<p class="empty">Hier vond ik nog geen boek over. Probeer een ander woord, of tik op een van de voorbeelden.</p>`;
  r.className='enter';r.innerHTML=html;
}

let zxingP=null;
function loadZXing(){
  if(window.ZXing)return Promise.resolve(window.ZXing);
  if(zxingP)return zxingP;
  zxingP=new Promise((res,rej)=>{const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload=()=>window.ZXing?res(window.ZXing):rej(new Error('geen ZXing'));s.onerror=rej;document.head.appendChild(s);});
  return zxingP;
}
async function readBarcode(file){
  try{
    if('BarcodeDetector' in window){
      const fmts=await window.BarcodeDetector.getSupportedFormats().catch(()=>[]);
      if(fmts.includes('ean_13')){
        const det=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a']});
        const bmp=await createImageBitmap(file);
        const r=await det.detect(bmp);
        if(r&&r[0])return r[0].rawValue;
      }
    }
  }catch(e){}
  try{
    const Z=await loadZXing();
    const reader=new Z.BrowserMultiFormatReader();
    const url=URL.createObjectURL(file);
    const r=await reader.decodeFromImageUrl(url);
    URL.revokeObjectURL(url);
    return r?r.getText():null;
  }catch(e){return null;}
}

    const match=t?BOOKS.find(b=>norm(b.t).includes(norm(t))||norm(t).includes(norm(b.t))):null;

      ${t?'<p class="muted">Dit boek staat nog niet in onze bibliotheek.</p>':''}</div>`);
  }catch(e){
    const msg={not_granted:'Claude mag niet meekijken in deze app.',rate_limited:'Claude is even te druk. Probeer het straks nog eens.',image_rejected:'Deze foto lukt niet. Maak een nieuwe foto.',refused:'Claude kan deze foto niet bekijken.'}[e&&e.code]||'Dat lukte niet. Probeer het nog eens.';

    setScanMsg(`<p>${msg}</p>`);

function palLine(who,text){const p=PALS[who];
  return `<div class="line" style="--pc:${p.color}"><span class="ava">${p.svg}</span><div class="bubble"><b>${p.name}</b><p>${text}${canSpeak?` <button class="say" data-act="say" data-who="${who}" data-v="${esc(String(text).replace(/<[^>]+>/g,''))}" aria-label="Lees voor">${ICON.speaker}</button>`:''}</p></div></div>`;}
function kidLine(text){return `<div class="line kid"><div class="bubble"><p>${esc(text)}</p></div></div>`;}
const wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));
function scrollEnd(){const o=$('#opts');if(o)o.scrollIntoView({block:'end',behavior:reduce?'auto':'smooth'});}
async function palSay(lines,token){
  const c=$('#chat');
  for(const [who,text] of lines){
    if(state.view!=='pals'||!state.chat||state.chat.token!==token)return false;
    c.insertAdjacentHTML('beforeend',`<div class="line" style="--pc:${PALS[who].color}"><span class="ava">${PALS[who].svg}</span><div class="bubble"><span class="dots"><i></i><i></i><i></i></span></div></div>`);
    scrollEnd();await wait(700);
    if(state.view!=='pals'||!state.chat||state.chat.token!==token)return false;
    c.lastElementChild.outerHTML=palLine(who,text);scrollEnd();
  }
  return true;
}
function showPals(){
  state.chat={token:Math.random(),step:0,ans:{}};
  setView('pals',`<section><button class="back" data-act="home">← Terug</button><h1>Toet en Bas helpen je kiezen</h1>
    <div class="chat" id="chat"></div><div class="opts" id="opts"></div></section>`,true);
  runStep();

async function runStep(){
  const ch=state.chat;const st=PSTEPS[ch.step];
  if(!await palSay(st.q(ch.ans),ch.token))return;
  $('#opts').innerHTML=st.opts.map(([l,v])=>`<button class="opt" data-act="palopt" data-v="${v}" data-l="${esc(l)}">${esc(l)}</button>`).join('');
  scrollEnd();
}
function palOpt(t){
  const ch=state.chat;if(!ch)return;const st=PSTEPS[ch.step];if(!st)return;
  ch.ans[st.id]=t.dataset.v;$('#opts').innerHTML='';
  $('#chat').insertAdjacentHTML('beforeend',kidLine(t.dataset.l));
  ch.step++;
  if(ch.step<PSTEPS.length)runStep();else palPicks();
}
function gRange(s){const m=String(s).match(/(\d+)\D+(\d+)/);return m?[+m[1],+m[2]]:[1,8];}
function pickBooks(a){
  const [lo,hi]=gRange(a.groep);
  const fit=b=>{const [x,y]=gRange(b.groep);return x<=hi&&y>=lo;};
  const tries=[
    b=>fit(b)&&(a.zin==='any'||b.g.includes(a.zin))&&(a.plaat==='any'||(a.plaat==='ja')===!!b.plaatjes),
    b=>fit(b)&&(a.zin==='any'||b.g.includes(a.zin)),
    b=>fit(b),
    ()=>true];
  let list=[];for(const f of tries){list=BOOKS.filter(f);if(list.length>=2)break;}
  list=list.map(b=>({b,s:b.likes+Math.random()*20})).sort((x,y)=>y.s-x.s).map(x=>x.b);
  const serious=b=>b.g.some(k=>['spannend','gevoel','fantasie','avontuur'].includes(k));
  const funny=b=>b.g.some(k=>['grappig','strip','dieren'].includes(k));
  const toet=list.find(serious)||list[0];
  const bas=list.find(b=>b!==toet&&funny(b))||list.find(b=>b!==toet)||toet;
  return {toet,bas};
}
async function palPicks(){
  const ch=state.chat;const {toet,bas}=pickBooks(ch.ans);const same=toet===bas;
  const lines=same?[['toet','Ik weet er een.'],['bas','Dat wilde ik nou ook zeggen!']]
    :[['toet','Ik weet er een!'],['bas','Ik ook. En de mijne is beter.'],['toet','Dat zullen we nog zien. Wiens tip kies jij?']];
  if(!await palSay(lines,ch.token))return;
  const card=(who,b)=>`<div class="pick" style="--pc:${PALS[who].color}"><div class="pick-h"><span class="ava sm">${PALS[who].svg}</span><span>Tip van ${PALS[who].name}</span></div>${cover(b,0,'','pals-'+who)}<p class="why">${esc(b.why||b.s)}</p></div>`;
  $('#opts').innerHTML=`<div class="picks ${same?'one':''}">${card('toet',toet)}${same?'':card('bas',bas)}</div><div class="again"><button class="chip" data-act="pals">Nog een keer</button></div>`;
  scrollEnd();
}
function speak(t){
  if(!canSpeak){return;}
  const u=new SpeechSynthesisUtterance(t.dataset.v);
  u.lang='nl-NL';
  const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith('nl'));
  if(v)u.voice=v;
  u.rate=.95;u.pitch=(PALS[t.dataset.who]||{}).pitch||1;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}

  else if(a==='search')showSearch(v||'');
  else if(a==='book')showBook(v,t.dataset.from);
  else if(a==='surprise')showSurprise();
  else if(a==='unwrap')unwrap(v);
  else if(a==='rate')rate(t);
  else if(a==='scan')showScan();
  else if(a==='demoscan')demoScan();
  else if(a==='askclaude')askClaude(t);
  else if(a==='pals')showPals();
  else if(a==='palopt')palOpt(t);
  else if(a==='say')speak(t);
  else if(a==='replay'){window.scrollTo(0,0);playIntro();}
});

/* Na 60 seconden stilte: opnieuw beginnen (op een gedeelde tablet ziet het volgende kind niets van het vorige) */
let idleT;
function resetIdle(){clearTimeout(idleT);idleT=setTimeout(()=>{state.q='';state.ratings={};state.photo=null;window.scrollTo(0,0);playIntro();},60000);}
['pointerdown','keydown','input','scroll'].forEach(ev=>window.addEventListener(ev,resetIdle,{passive:true}));

showHome();
playIntro();
resetIdle();
</script>
</body>
</html>
